[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
tempfile = "3"
egui_kittest = "=0.36.2"
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts"] }
rfd = "=0.17.2"
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
yaxpeax-arm = { version = "=0.4.0", default-features = false, features = ["std"] }
yaxpeax-arch = { version = "=0.3.3", default-features = false, features = ["std"] }
omnidecomp-core = { path = "crates/core" }
omnidecomp-formats = { path = "crates/formats" }
omnidecomp-engines = { path = "crates/engines" }
omnidecomp-app = { path = "crates/app" }
omnidecomp-plugins = { path = "crates/plugins" }
omnidecomp-viewmodel = { path = "crates/viewmodel" }
omnidecomp-testsamples = { path = "crates/testsamples" }

# Release builds: smaller binaries without local paths in symbol tables. Overflow checks stay off in release;
# the debug-mode tests are what catch arithmetic overflow.
[profile.release]
strip = "symbols"
